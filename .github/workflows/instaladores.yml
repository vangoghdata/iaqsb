# Genera los instaladores de IAQSB para Windows, macOS (Apple Silicon e Intel) y Linux.
#
# - Se ejecuta a mano (pestaña Actions → «Instaladores» → Run workflow) o al publicar
#   una etiqueta de versión (git tag v0.2.0 && git push --tags). Con la etiqueta, los
#   instaladores se suben a una versión (Release) de GitHub en borrador.
# - macOS: sin certificado de Apple la app sale firmada «ad hoc» (signingIdentity "-"
#   en tauri.conf.json) y la primera vez hay que abrirla desde Ajustes del Sistema →
#   Privacidad y seguridad → «Abrir igualmente» (ver INSTALAR.md). Si se agregan los
#   secretos APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD y APPLE_TEAM_ID, Tauri la firma y la notariza, y abre
#   con doble clic como cualquier app.
name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Windows
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            paquetes: nsis
          - nombre: macOS (Apple Silicon)
            os: macos-15
            triple: aarch64-apple-darwin
            paquetes: app,dmg
          - nombre: macOS (Intel)
            # máquina Intel: HiGHS (C++) se compila sin compilación cruzada
            os: macos-15-intel
            triple: x86_64-apple-darwin
            paquetes: app,dmg
          - nombre: Linux
            # 22.04: el instalador funciona también en distribuciones más nuevas (glibc)
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            paquetes: deb,rpm,appimage
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias de Linux (ventana, HiGHS)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf cmake clang libclang-dev

      - name: LLVM en Windows (libclang para HiGHS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ProgramFiles\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> ../../../target

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: CLI y servidor MCP
        run: cargo build --release --target ${{ matrix.triple }} -p iaqsb -p iaqsb-mcp

      - name: Copiar binarios junto a la app
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir -p apps/desktop/src-tauri/binaries
          for b in iaqsb iaqsb-mcp; do
            cp "target/${{ matrix.triple }}/release/$b$ext" "apps/desktop/src-tauri/binaries/$b-${{ matrix.triple }}$ext"
          done

      - name: Aplicación e instaladores
        working-directory: apps/desktop
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # los secretos de Apple solo se pasan si existen (sin ellos: firma ad hoc)
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$S_APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              s="S_$v"; export "$v=${!s}"
            done
          fi
          npm ci
          npx tauri build --target ${{ matrix.triple }} --bundles ${{ matrix.paquetes }}

      - name: Subir instaladores (artefactos)
        uses: actions/upload-artifact@v5
        with:
          name: IAQSB-${{ matrix.triple }}
          if-no-files-found: error
          path: |
            target/${{ matrix.triple }}/release/bundle/nsis/*.exe
            target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            target/${{ matrix.triple }}/release/bundle/deb/*.deb
            target/${{ matrix.triple }}/release/bundle/rpm/*.rpm
            target/${{ matrix.triple }}/release/bundle/appimage/*.AppImage

      - name: Publicar en la versión (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/${{ matrix.triple }}/release/bundle/nsis/*.exe
            target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            target/${{ matrix.triple }}/release/bundle/deb/*.deb
            target/${{ matrix.triple }}/release/bundle/rpm/*.rpm
            target/${{ matrix.triple }}/release/bundle/appimage/*.AppImage
